- name: Add Docker GPG key.
  # rpm_key invokes gpg without an explicit command; on RHEL 10 (gpg 2.4.x) it
  # falls into "guess mode" and fails with "packet(6) with unknown version 6".
  # Download + rpm --import instead (idempotent via the imported gpg-pubkey).
  block:
    - name: Download Docker GPG key.
      get_url:
        url: "{{ docker_yum_gpg_key }}"
        dest: /etc/pki/rpm-gpg/RPM-GPG-KEY-docker-ce
        owner: root
        group: root
        mode: 0644

    - name: Check whether the Docker GPG key is already imported.
      shell: rpm -q --queryformat '%{SUMMARY}\n' gpg-pubkey | grep -qi docker
      register: docker_gpg_key_check
      changed_when: false
      failed_when: false

    - name: Import Docker GPG key.
      command: rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-docker-ce
      when: docker_gpg_key_check.rc != 0
  when: docker_add_repo | bool

- name: Add Docker repository.
  get_url:
    url: "{{ docker_yum_repo_url }}"
    dest: '/etc/yum.repos.d/docker-{{ docker_edition }}.repo'
    owner: root
    group: root
    mode: 0644
  when: docker_add_repo | bool

- name: Configure Docker Nightly repo.
  ini_file:
    dest: '/etc/yum.repos.d/docker-{{ docker_edition }}.repo'
    section: 'docker-{{ docker_edition }}-nightly'
    option: enabled
    value: '{{ docker_yum_repo_enable_nightly }}'
    mode: 0644
    no_extra_spaces: true
  when: docker_add_repo | bool

- name: Configure Docker Test repo.
  ini_file:
    dest: '/etc/yum.repos.d/docker-{{ docker_edition }}.repo'
    section: 'docker-{{ docker_edition }}-test'
    option: enabled
    value: '{{ docker_yum_repo_enable_test }}'
    mode: 0644
    no_extra_spaces: true
  when: docker_add_repo | bool

- name: Configure containerd on RHEL 8.
  block:
    - name: Ensure runc is not installed.
      package:
        name: runc
        state: absent

    - name: Ensure container-selinux is installed.
      package:
        name: container-selinux
        state: present

    - name: Ensure containerd.io is installed.
      package:
        name: containerd.io
        state: present
  when: ansible_distribution_major_version | int == 8
